name: Build iXgram 2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          cache: true

      - name: Extract source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Find project
        shell: bash
        run: |
          set -e
          MAKEFILE="$(find source -type f -name Makefile | head -n 1)"
          test -n "$MAKEFILE"
          echo "PROJECT_DIR=$(dirname "$MAKEFILE")" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          cd "$PROJECT_DIR"
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect Dylib
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          find "$PROJECT_DIR" \
            -type f \
            -name '*.dylib' \
            -not -path '*/.theos/*' \
            -exec cp {} artifacts/ \;

          test -n "$(find artifacts -name '*.dylib' -print -quit)"

      - name: Collect packages
        shell: bash
        run: |
          find "$PROJECT_DIR" \
            -type f \
            \( -name '*.deb' -o -name '*.ipa' \) \
            -exec cp {} artifacts/ \; || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: iXgram-2.0-build
          path: artifacts
          if-no-files-found: error
