name: Build iXgram 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Find project
        run: |
          set -e
          MAKEFILE="$(find source -type f -name Makefile | head -n 1)"
          test -n "$MAKEFILE"
          echo "PROJECT_DIR=$(dirname "$MAKEFILE")" >> "$GITHUB_ENV"

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build
        run: |
          set -e
          cd "$PROJECT_DIR"
          make clean package FINALPACKAGE=1

      - name: Collect output
        run: |
          set -e
          mkdir -p artifacts

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.dylib" -o -name "*.deb" -o -name "*.ipa" \) \
            -not -path "*/.theos/*" \
            -exec cp {} artifacts/ \;

          find artifacts -type f -print

          test -n "$(find artifacts -type f -print -quit)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: iXgram-2.0-build
          path: artifacts
          if-no-files-found: error
